apiVersion: apps/v1
kind: Deployment
metadata:
  name: muralidhar-impl-mcp
  namespace: ai-user2
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: muralidhar-impl-mcp
  template:
    metadata:
      labels:
        app: muralidhar-impl-mcp
    spec:
      containers:
      - name: implementation-mcp-server
        image: abhishek15c/implementation-mcp-server:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        env:
        - name: WORKSPACE_ROOT
          value: /app/workspace
        - name: TEMPLATES_DIR
          value: /app/templates
        - name: PERSIST_DIR
          value: /app/vector_store
        - name: SERVER_PORT
          value: "8000"
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 2000m
            memory: 4Gi
        volumeMounts:
        - name: vector-store-vol
          mountPath: /app/vector_store
        # - name: workspace-vol
        #   mountPath: /app/workspace # workspace mount (user will configure NFS/RWX later)
      volumes:
      - name: vector-store-vol
        persistentVolumeClaim:
          claimName: impl-vector-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: muralidhar-impl-mcp-svc
  namespace: ai-user2
spec:
  type: NodePort
  selector:
    app: muralidhar-impl-mcp
  ports:
  - port: 8000
    targetPort: 8000
    nodePort: 31987
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: impl-vector-pvc
  namespace: ai-user2
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
